<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>App | DocuMind</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg?v=__v__" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/base.css?v=__v__" />
  <link rel="stylesheet" href="/static/app.css?v=__v__" />
</head>
<body>
<div class="shell" id="shell" data-state="empty">

  <header class="bar">
    <a class="brand" href="/" aria-label="DocuMind home"><img src="/static/logo.svg?v=__v__" alt="" class="brand-mark" />DocuMind</a>

    <div class="file-switch" id="file-switch" hidden>
      <button type="button" class="file-chip" id="file-chip" aria-haspopup="listbox" aria-expanded="false">
        <span class="chip-ico">PDF</span>
        <span class="chip-name" id="chip-name">No file</span>
        <span class="chip-state" id="chip-state"></span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="menu" id="menu" role="listbox" hidden>
        <ul id="menu-list"></ul>
      </div>
    </div>

    <div class="bar-right">
      <span class="status" id="status-badge" title="Answer engine"><i></i><span id="status-text">Connecting</span></span>
      <label class="btn btn-dark btn-sm upload-btn" for="file-input" id="upload-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Upload PDF</span>
      </label>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>
  <input id="file-input" class="sr-only" type="file" accept="application/pdf,.pdf" tabindex="-1" />

  <!-- First screen: nothing uploaded yet -->
  <main class="start" id="start">
    <div class="start-inner">
      <p class="eyebrow">Start here</p>
      <h1>Upload a PDF to begin.</h1>
      <p class="lead">It opens in a viewer right away. Once it is read, ask anything about it.</p>
      <label id="dropzone" class="dropzone" for="file-input" tabindex="0">
        <span class="dz-plus" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span>
        <span class="dz-title">Drop a PDF here, or <u>browse</u></span>
        <span class="dz-sub">Any PDF up to 50 MB. Scans are read with OCR.</span>
      </label>
      <p class="start-note">Shared demo, no logins. Use public or sample documents only.</p>
    </div>
    <footer class="start-foot"><span>Designed &amp; Developed by <strong>Vivek</strong></span><span>&copy; 2026 All rights reserved.</span></footer>
  </main>

  <!-- Workspace: preview + chat -->
  <main class="work" id="work" data-active="preview" hidden>
    <section class="pane pane-pv" data-pane="preview" aria-label="PDF preview">
      <div class="pv-bar">
        <div class="pv-tools" id="pv-tools">
          <button type="button" class="icon-btn" id="pv-prev" aria-label="Previous page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
          <span class="pv-page"><input id="pv-page" type="number" min="1" value="1" inputmode="numeric" aria-label="Page number" /><span class="of">of <span id="pv-total">1</span></span></span>
          <button type="button" class="icon-btn" id="pv-next" aria-label="Next page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
        <div class="pv-tools">
          <button type="button" class="icon-btn" id="pv-out" aria-label="Zoom out">&minus;</button>
          <button type="button" class="icon-btn" id="pv-in" aria-label="Zoom in">+</button>
          <a class="icon-btn" id="pv-open" target="_blank" rel="noopener" aria-label="Open PDF in a new tab" title="Open in new tab"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14 21 3"/></svg></a>
        </div>
      </div>
      <div class="pv-body" id="pv-body"><div class="pv-pages" id="pv-pages"></div></div>
    </section>

    <section class="pane pane-chat" data-pane="chat" aria-label="Chat">
      <div class="chat-head">
        <div class="scope" id="scope" role="group" aria-label="Search scope" hidden>
          <button type="button" class="seg active" data-scope="doc">This PDF</button>
          <button type="button" class="seg" data-scope="all">All PDFs</button>
        </div>
      </div>
      <div class="chat-scroll" id="messages" aria-live="polite"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <textarea id="chat-input" rows="1" placeholder="Ask about this PDF" aria-label="Your question" maxlength="4000" disabled></textarea>
        <button type="button" class="deep-toggle" id="deep-btn" aria-pressed="false" title="Deep dive: a full explanation gathered from across the PDF" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span>Deep dive</span>
        </button>
        <button type="button" class="deep-toggle" id="voice-btn" aria-pressed="false" title="Read each answer aloud as well" hidden disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
          <span>Voice</span>
        </button>
        <button type="submit" class="send" id="send-btn" aria-label="Send question" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Workspace sections" hidden>
    <button type="button" data-tab="preview" class="active">PDF</button>
    <button type="button" data-tab="chat">Chat</button>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="/static/app.js?v=__v__" defer></script>
</body>
</html>
